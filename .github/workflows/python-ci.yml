name: Python checks
on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "smart_money/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "smart_money/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py smart_money tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
