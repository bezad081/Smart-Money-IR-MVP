name: Python checks

on:
  push:
    branches: [main, "python/**"]
    paths:
      - "notebooks/**"
      - "smart_money/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-notebook.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "notebooks/**"
      - "smart_money/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-notebook.txt"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q smart_money tests
      - name: Validate notebook JSON and Python cells
        run: python -c 'import ast,json; nb=json.load(open("notebooks/Smart_Money_IR.ipynb", encoding="utf-8")); [ast.parse("".join(c["source"])) for c in nb["cells"] if c["cell_type"] == "code"]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
