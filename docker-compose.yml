services:
  db:
    image: postgres:16-alpine
    container_name: smart-money-ir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartmoney
      POSTGRES_PASSWORD: smartmoney
      POSTGRES_DB: smartmoney
    ports:
      - "5432:5432"
    volumes:
      - smart_money_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmoney -d smartmoney"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  smart_money_pgdata:
